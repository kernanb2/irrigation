<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000" role="img" aria-label="Complete Unit E wiring: 12V supply, F1, red 12V blocks, LM2596 to black 5V blocks, ESP32 GPIOs to an 8-relay module, fused grey blocks to each relay, and the five valves through yellow and blue blocks; all grounds to green blocks.">
