.b-red { fill: #d64545; } .b-grey { fill: #a4aaa7; } .b-green { fill: #2e8b57; }
.b-black { fill: #26292b; } .b-yellow { fill: #e8c547; } .b-blue { fill: #2f6fd6; }
.bl { font-size: 10.5px; font-weight: 600; fill: #ffffff; }
.bl-grey, .bl-yellow { fill: #1d2420; }
.gtag { fill: #2e8b57; } .gt { font-size: 10.5px; font-weight: 600; fill: #ffffff; }
.rtag { fill: #d64545; } .rt { font-size: 10.5px; font-weight: 600; fill: #ffffff; }
