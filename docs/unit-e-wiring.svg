.w12 { stroke: #c62828; } .wy { stroke: #b88a00; } .wb { stroke: #1f5fbf; }
.wg { stroke: #2e8b57; } .w5 { stroke: #d26a00; } .w33 { stroke: #b5179e; } .ws { stroke: #6a4bc4; }
.d-w12 { fill: #c62828; } .d-w5 { fill: #d26a00; }
